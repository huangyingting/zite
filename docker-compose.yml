services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zite
      POSTGRES_PASSWORD: zite_prod_password
      POSTGRES_DB: zite_prod
    ports:
      - "5432:5432"
    volumes:
      - zite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zite -d zite_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  zite-app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: "postgresql://zite:zite_prod_password@postgres:5432/zite_prod?schema=public"
      NEXTAUTH_URL: "http://localhost:3010"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-in-production}"
      AI_PROVIDER: "${AI_PROVIDER:-copilot-sdk}"
      COPILOT_MODEL: "${COPILOT_MODEL:-gpt-4.1}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  zite_pgdata:
